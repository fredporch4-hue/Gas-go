function custSync(){if(!S.user||S.user.role=="vendor")return;var m=mk(),ch=false,fin=[],cancel=[];
var sig=JSON.stringify(m.vendors.map(function(v){return[v.id,v.pk,v.closed,v.h,v.ph,v.a]}));if(sig!==vsig){var first=vsig==="";vsig=sig;mergeV();if(!first)ch=true}
S.orders.forEach(function(o){if(!o.jid)return;var j=m.jobs.filter(function(x){return x.jid==o.jid})[0];if(!j)return;
if(o.st=="pending"){var c=j.chat||[];if(c.length!=(o.vn||0)){c.slice(o.vn||0).forEach(function(x){if(x.f=="v")o.chat.push(x)});o.vn=c.length;ch=true}
o.att=j.att||0;if(o.vs!=j.st){o.vs=j.st;if(j.st=="accepted"){toast("✅ "+o.v+" accepted your order");ping("Order accepted",o.v+" is preparing your gas")}if(j.st=="out"){toast("🛵 Your gas is on the way");ping("On the way","Your gas is out for delivery")}ch=true}
if(j.st=="declined"){o.st="failed";o.chat.push({f:"s",x:"The vendor declined this order. You were not charged.",t:Date.now()});toast("The vendor declined your order. You were not charged.");ch=true}
else if(j.st=="delivered"){o.chat.push({f:"s",x:"✅ Vendor entered your secret code. Delivery confirmed.",t:Date.now()});fin.push(o.id)}}
else if(o.st=="failed"&&(j.st=="new"||j.st=="accepted"||j.st=="out"))cancel.push(o.jid)});
var sv=S.sv;if(sv&&sv.jid&&sv.st=="pending"){var j=m.jobs.filter(function(x){return x.jid==sv.jid})[0];if(j){if(j.st=="declined"){tx("Refund: smart valve declined",SV_VALVE+SV_FEAT);S.sv=null;toast("The vendor declined your smart valve order. You were refunded.");ch=true}else if(j.step>sv.step&&sv.step<3){for(var i=sv.step+1;i<=Math.min(j.step,3);i++)sv.ts[i]=Date.now();sv.step=Math.min(j.step,3);ch=true}}}
if(cancel.length)mkUpd(function(mm){mm.jobs.forEach(function(j){if(cancel.indexOf(j.jid)>=0)j.st="cancelled"})});
if(ch||fin.length){save();if(!fin.length)render(true)}fin.forEach(function(id){done(id,true)})}

function lab(e){var b=e.closest&&e.closest(".card"),t=b&&b.querySelector("b");return e.getAttribute("placeholder")||(t&&t.textContent)||""}
function fix(){q=0;
document.querySelectorAll("[onclick]").forEach(function(e){if(/^(BUTTON|A|INPUT|SELECT)$/.test(e.tagName)||e.classList.contains("ov"))return;if(!e.hasAttribute("role"))e.setAttribute("role","button");if(!e.hasAttribute("tabindex"))e.tabIndex=0});
document.querySelectorAll("input:not([aria-label]),select:not([aria-label]),textarea:not([aria-label])").forEach(function(e){var l=lab(e);if(l)e.setAttribute("aria-label",l)});
for(var i=1;i<=5;i++){var b=$("st"+i);if(b)b.setAttribute("aria-label",i+(i==1?" star":" stars"))}
document.querySelectorAll("#nav button").forEach(function(b){if(b.classList.contains("on"))b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
var sh=document.querySelector("#sheet .sht");
if(sh&&!sh.hasAttribute("role")){if(!wasOpen)opener=document.activeElement;sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");var t=sh.querySelector("b");if(t)sh.setAttribute("aria-label",t.textContent);sh.tabIndex=-1;sh.focus({preventScroll:true})}
if(!sh&&wasOpen&&opener&&document.body.contains(opener))try{opener.focus({preventScroll:true})}catch(e){}
wasOpen=!!sh}
new MutationObserver(function(){if(!q)q=requestAnimationFrame(fix)}).observe(document.body,{childList:true,subtree:true});
document.addEventListener("keydown",function(e){var a=document.activeElement;
if((e.key=="Enter"||e.key==" ")&&a&&a.getAttribute&&a.getAttribute("role")=="button"&&!/^(BUTTON|A)$/.test(a.tagName)){e.preventDefault();a.click();return}
if(e.key=="Tab"){var sh=document.querySelector("#sheet .sht");if(!sh)return;var f=[].slice.call(sh.querySelectorAll("button,a[href],input,select,textarea,[tabindex='0']")).filter(function(x){return !x.disabled&&x.offsetParent});if(!f.length)return;var F=f[0],L=f[f.length-1];if(e.shiftKey&&(a==F||a==sh)){e.preventDefault();L.focus()}else if(!e.shiftKey&&a==L){e.preventDefault();F.focus()}}});
fix()})();
boot();
</script></body></html>
